apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kustomization
spec:
  serviceAccountName: flux
  interval: 1m0s
  prune: false
  sourceRef:
    kind: GitRepository
    name: git-repo
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cloudy-configs